# 公共训练参数
training:
  epochs: 5
  learning_rate: 0.001
  optimizer: "Adam"
  freeze_backbone: true

# 公共差分隐私参数
privacy:
  epsilon: 1.0
  sensitivity: 1.0
  mechanism: "gaussian"   # 可选 gaussian / laplace

# 公共数据参数
data:
  batch_size: 2
  img_size: 640
  num_samples: 3

# 公共输出
output:
  root_dir: "./outputs"